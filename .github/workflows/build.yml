# ────────────────────────────────────────────────────────────────
# Сборка установщика Phygital Machines для Windows (с v1.17.1).
#
# Загрузили файлы в main (или открыли pull request) → автопроверка
# (npm test: синтаксис, переводы, эталоны заданий) и сборка установщика.
# Готовый установщик лежит на странице запуска (раздел Artifacts) —
# его можно скачать и проверить на своём компьютере. Ученикам он
# при этом НЕ уходит.
#
# Выпустить обновление для учеников:
#   1. Поменяйте "version" в package.json (например 1.17.1 → 1.17.2).
#   2. Вкладка Actions → Build installer → Run workflow → ветка main,
#      поставьте галочку «Опубликовать для учеников» → Run workflow.
#   Через 5–10 минут появится релиз в Releases, и установленные
#   программы предложат ученикам обновиться.
#
# Уже вышедшую версию повторно опубликовать нельзя: сборка остановится
# и подскажет поменять номер версии. Так у учеников никогда не окажется
# двух разных программ с одним номером.
# ────────────────────────────────────────────────────────────────
name: Build installer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать для учеников (выпустить обновление)'
        type: boolean
        default: false

# несколько загрузок подряд — собирается только последняя; выпуск не прерывается
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # нужно только шагу публикации
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install

      - name: Автопроверка (синтаксис, переводы, эталоны заданий)
        run: npm test

      - name: Узнать версию приложения
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Проверить, что эта версия ещё не выпущена
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::Версия ${{ steps.ver.outputs.version }} уже выпущена. Поменяйте version в package.json (например на следующую) и запустите выпуск снова."
            exit 1
          }
          exit 0

      - name: Собрать установщик Windows
        run: npx electron-builder --win nsis --publish never

      - name: Сохранить установщик как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: PhygitalMachines-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/PhygitalMachines-Setup-*.exe
            dist/latest.yml
          retention-days: 14

      - name: Опубликовать для учеников (Releases)
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Phygital Machines ${{ steps.ver.outputs.version }}"
          body: "Скачайте файл PhygitalMachines-Setup-${{ steps.ver.outputs.version }}.exe и запустите его для установки. Остальные файлы (latest.yml, *.blockmap) нужны для автообновления — не удаляйте их."
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/PhygitalMachines-Setup-*.exe
            dist/PhygitalMachines-Setup-*.exe.blockmap
            dist/latest.yml
