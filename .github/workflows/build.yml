# ────────────────────────────────────────────────────────────────
# Автоматическая сборка установщика Phygital Machines для Windows.
#
# Запускается при каждой загрузке файлов в ветку main
# (или вручную: вкладка Actions → Build installer → Run workflow).
#
# Результат: установщик PhygitalMachines-Setup-*.exe в разделе Releases.
# Для выхода нового обновления поменяйте "version" в package.json —
# установленные программы сами предложат пользователям обновиться.
# ────────────────────────────────────────────────────────────────
name: Build installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить зависимости
        run: npm install

      - name: Узнать версию приложения
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Собрать установщик Windows
        run: npx electron-builder --win nsis --publish never

      - name: Сохранить установщик как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: PhygitalMachines-Setup
          path: |
            dist/PhygitalMachines-Setup-*.exe
            dist/latest.yml

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Phygital Machines ${{ steps.ver.outputs.version }}"
          body: "Скачайте файл PhygitalMachines-Setup-${{ steps.ver.outputs.version }}.exe и запустите его для установки. Остальные файлы (latest.yml, *.blockmap) нужны для автообновления — не удаляйте их."
          files: |
            dist/PhygitalMachines-Setup-*.exe
            dist/PhygitalMachines-Setup-*.exe.blockmap
            dist/latest.yml
